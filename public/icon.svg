<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Cloud icon -->
  <g filter="url(#shadow)">
    <path
      d="M380 340 H160 C120 340 90 310 90 270 C90 235 115 205 150 200 C160 145 205 110 260 110 C310 110 350 140 365 185 C395 190 420 215 420 250 C420 295 390 340 380 340 Z"
      fill="url(#cloudGrad)"
    />
  </g>

  <!-- Floating note paper inside cloud -->
  <g filter="url(#shadow)" transform="translate(180, 210)">
    <rect x="0" y="0" width="150" height="170" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" />
    <!-- Note lines -->
    <rect x="25" y="35" width="80" height="12" rx="6" fill="#3b82f6" />
    <rect x="25" y="65" width="100" height="8" rx="4" fill="#94a3b8" />
    <rect x="25" y="85" width="90" height="8" rx="4" fill="#94a3b8" />
    <rect x="25" y="105" width="70" height="8" rx="4" fill="#94a3b8" />
    <!-- Checkmark bullet -->
    <circle cx="15" cy="41" r="4" fill="#10b981" />
  </g>

  <!-- Pencil / Pen icon -->
  <g transform="translate(290, 310) rotate(-45)">
    <path d="M0 0 L20 0 L24 60 L10 75 L-4 60 Z" fill="url(#penGrad)" stroke="#0369a1" stroke-width="3" />
    <polygon points="10,75 5,60 15,60" fill="#f8fafc" />
    <polygon points="10,75 8,70 12,70" fill="#0f172a" />
  </g>
</svg>
